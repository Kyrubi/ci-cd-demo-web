name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: npm install
      - run: npm test
      - run: echo "Construyendo la aplicación (simulado)"
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Simular despliegue
        run: echo "Desplegando app a producción (simulado)"